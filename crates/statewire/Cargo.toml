[package]
name = "statewire"
description = "Rust client for the Statewire protocol: replicated state from a host, typed commands back"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["statewire", "sync", "replication", "websocket", "harness-sdk"]
categories = ["network-programming", "web-programming::websocket"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures-util = { version = "0.3", optional = true, default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"], optional = true }
tokio-tungstenite = { version = "0.26", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["stream", "rustls-tls"] }

[features]
default = []
ws = ["dep:futures-util", "dep:tokio", "dep:tokio-tungstenite"]
http = ["dep:futures-util", "dep:tokio", "dep:reqwest"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
