name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - crates/*/Cargo.toml

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Find unpublished versions
        id: plan
        run: |
          set -euo pipefail
          # Sparse index path for crate names of four or more characters.
          index_has() {
            local name=$1 version=$2
            curl -sf "https://index.crates.io/${name:0:2}/${name:2:2}/$name" \
              | jq -e --arg v "$version" 'select(.vers == $v)' > /dev/null
          }
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "statewire") | .version')
          pending=""
          # Dependency order: harness-threads depends on statewire.
          for crate in statewire harness-threads; do
            if index_has "$crate" "$version"; then
              echo "$crate $version is already on crates.io, skipping"
            else
              echo "$crate $version will be published"
              pending="$pending $crate"
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pending=${pending# }" >> "$GITHUB_OUTPUT"

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: steps.plan.outputs.pending != ''
        id: auth

      - name: Publish
        if: steps.plan.outputs.pending != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          PENDING: ${{ steps.plan.outputs.pending }}
        run: |
          set -euo pipefail
          # Sparse index path for crate names of four or more characters.
          index_has() {
            local name=$1 version=$2
            curl -sf "https://index.crates.io/${name:0:2}/${name:2:2}/$name" \
              | jq -e --arg v "$version" 'select(.vers == $v)' > /dev/null
          }
          for crate in $PENDING; do
            cargo publish -p "$crate" --all-features --locked
            echo "Waiting for $crate $VERSION in the crates.io index"
            for _ in $(seq 1 60); do
              if index_has "$crate" "$VERSION"; then
                echo "$crate $VERSION is in the index"
                continue 2
              fi
              sleep 10
            done
            echo "::error::$crate $VERSION did not appear in the index within 10 minutes"
            exit 1
          done
